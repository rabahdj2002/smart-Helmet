# One-command local demo: docker compose up --build
# Dashboard: http://localhost:8000  (login demo / demo12345)
services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  web:
    build: ./backend
    depends_on:
      - mqtt
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-secret-change-me}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      DJANGO_SQLITE_PATH: /data/db.sqlite3
      DASHBOARD_MQTT_BROKER_HOST: mqtt
      DASHBOARD_MQTT_BROKER_PORT: "1883"
    volumes:
      - db-data:/data
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             exec gunicorn smarthelmet.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4"

  simulator:
    build: ./backend
    depends_on:
      - mqtt
      - web
    command: ["python", "simulate_telemetry.py", "--host", "mqtt", "--crash", "HALO-04", "--crash-after", "45"]

volumes:
  db-data:
